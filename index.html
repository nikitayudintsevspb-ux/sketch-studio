
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sketch Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#202329;color:white;font-family:Arial;overflow:hidden}
header,footer{height:48px;background:#30343c;display:flex;align-items:center;gap:6px;padding:5px;overflow-x:auto}
button{border:0;border-radius:8px;background:#454b57;color:white;padding:9px;white-space:nowrap}
button.active{background:#6578db}
#main{display:flex;height:calc(100dvh - 96px)}
#tools{width:48px;background:#30343c;display:flex;flex-direction:column;gap:5px;padding:4px}
.tool{height:40px;padding:4px;font-size:18px}
#area{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#444951;overflow:hidden;touch-action:none}
#paper{width:min(100%,900px);aspect-ratio:4/3;background:white;position:relative;box-shadow:0 2px 15px #0008}
canvas{position:absolute;width:100%;height:100%;left:0;top:0;touch-action:none}
#panel{width:145px;background:#30343c;padding:8px;overflow:auto}
label{font-size:12px;display:block;margin:8px 0 4px}
input[type=range]{width:100%}
input[type=color]{width:100%;height:35px}
#layers{display:flex;flex-direction:column;gap:4px}
.layer{padding:8px;background:#454b57;border-radius:6px;font-size:12px}
.layer.sel{outline:2px solid #8293ff}
#swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid white}
@media(max-width:600px){#panel{width:125px;padding:5px}#tools{width:43px}}
</style>
</head>
<body>
<header>
<b>✦ Sketch Studio</b>
<button onclick="undo()">↶</button>
<button onclick="redo()">↷</button>
<button onclick="newLayer()">＋ Слой</button>
<button onclick="savePNG()">PNG</button>
<button onclick="saveProject()">Проект</button>
</header>
<div id="main">
<div id="tools">
<button class="tool active" onclick="setTool('brush',this)">🖌</button>
<button class="tool" onclick="setTool('eraser',this)">◩</button>
<button class="tool" onclick="setTool('line',this)">／</button>
<button class="tool" onclick="setTool('rect',this)">▱</button>
<button class="tool" onclick="setTool('ellipse',this)">◯</button>
<button class="tool" onclick="setTool('fill',this)">▧</button>
<button class="tool" onclick="setTool('text',this)">T</button>
<button class="tool" onclick="setTool('picker',this)">滴</button>
</div>
<div id="area">
<div id="paper"></div>
</div>
<div id="panel">
<b>Кисть</b>
<label>Размер: <span id="sv">8</span></label>
<input id="size" type="range" min="1" max="100" value="8" oninput="brushSize=+this.value;sv.textContent=this.value">
<label>Непрозрачность</label>
<input id="alpha" type="range" min="1" max="100" value="100" oninput="opacity=this.value/100">
<label>Тип кисти</label>
<select id="type" style="width:100%;padding:7px">
<option value="round">Круглая</option>
<option value="pencil">Карандаш</option>
<option value="marker">Маркер</option>
<option value="square">Квадратная</option>
</select>
<label>Цвет</label>
<input type="color" id="color" value="#222222" onchange="ink=this.value">
<div id="swatches"></div>
<hr>
<b>Слои</b>
<div id="layers"></div>
<button onclick="deleteLayer()">− Удалить</button>
<label>Прозрачность слоя</label>
<input type="range" min="0" max="100" value="100" oninput="layerOpacity(this.value)">
<button onclick="moveLayer(-1)">↑</button>
<button onclick="moveLayer(1)">↓</button>
<hr>
<button onclick="clearLayer()">Очистить слой</button>
<button onclick="flip()">Отразить</button>
</div>
</div>
<footer>
<button onclick="saveJPG()">Сохранить JPG</button>
<button onclick="document.getElementById('project').click()">Открыть проект</button>
<input id="project" type="file" accept=".json" hidden onchange="loadProject(event)">
<button onclick="alert('Рисуй пальцем или стилусом. Используй слои, кисти, фигуры и заливку. Сохраняй результат в PNG или JPG.')">Помощь</button>
</footer>
<script>
const W=1200,H=900;
const paper=document.getElementById('paper');
let layers=[],active=0,tool='brush',ink='#222222',brushSize=8,opacity=1;
let drawing=false,sx=0,sy=0,lx=0,ly=0,backup=null;
let history=[],future=[];
function makeLayer(name){
 let c=document.createElement('canvas');c.width=W;c.height=H;
 paper.appendChild(c);
 return {name,canvas:c,ctx:c.getContext('2d'),visible:true,opacity:1};
}
function current(){return layers[active]}
function renderLayers(){
 let box=document.getElementById('layers');box.innerHTML='';
 layers.forEach((l,i)=>{
 let b=document.createElement('div');
 b.className='layer'+(i===active?' sel':'');
 b.textContent=(l.visible?'◉ ':'○ ')+l.name;
 b.onclick=()=>{active=i;renderLayers()};
 box.appendChild(b);
 });
}
function snapshot(){
 history.push(layers.map(l=>({name:l.name,opacity:l.opacity,visible:l.visible,data:l.canvas.toDataURL()})));
 if(history.length>15)history.shift();
 future=[];
}
function restore(data){
 paper.innerHTML='';layers=[];
 data.forEach(o=>{
 let l=makeLayer(o.name);l.opacity=o.opacity;l.visible=o.visible;
 l.canvas.style.opacity=o.opacity;l.canvas.style.display=o.visible?'block':'none';
 let im=new Image();im.onload=()=>l.ctx.drawImage(im,0,0);im.src=o.data;
 layers.push(l);
 });
 active=0;renderLayers();
}
function undo(){if(history.length<2)return;future.push(history.pop());restore(history[history.length-1])}
function redo(){if(!future.length)return;let s=future.pop();history.push(s);restore(s)}
function setTool(t,b){tool=t;document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function point(e){let r=paper.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function segment(x,y){
 let c=current().ctx;c.save();c.globalAlpha=opacity;c.lineWidth=brushSize;c.lineCap=document.getElementById('type').value==='square'?'square':'round';
 c.strokeStyle=ink;
 if(tool==='eraser'){c.globalCompositeOperation='destination-out';c.strokeStyle='#000'}
 if(document.getElementById('type').value==='marker')c.globalAlpha=opacity*.3;
 if(document.getElementById('type').value==='pencil')c.globalAlpha=opacity*.6;
 c.beginPath();c.moveTo(lx,ly);c.lineTo(x,y);c.stroke();c.restore();
 lx=x;ly=y;
}
function down(e){
 let p=point(e);sx=lx=p.x;sy=ly=p.y;
 if(tool==='picker'){let d=current().ctx.getImageData(p.x,p.y,1,1).data;ink='#'+[d[0],d[1],d[2]].map(x=>x.toString(16).padStart(2,'0')).join('');document.getElementById('color').value=ink;return}
 if(tool==='text'){let t=prompt('Текст');if(t){let c=current().ctx;c.fillStyle=ink;c.font='36px Arial';c.fillText(t,p.x,p.y);snapshot()}return}
 if(tool==='fill'){fill(p.x,p.y);snapshot();return}
 drawing=true;
 if(['brush','eraser'].includes(tool)){segment(p.x+.01,p.y+.01)}
 else backup=current().ctx.getImageData(0,0,W,H);
 e.preventDefault();
}
function move(e){
 if(!drawing)return;
 let p=point(e),c=current().ctx;
 if(tool==='brush'||tool==='eraser')segment(p.x,p.y);
 else{
 c.putImageData(backup,0,0);c.save();c.globalAlpha=opacity;c.strokeStyle=ink;c.lineWidth=brushSize;c.beginPath();
 if(tool==='line'){c.moveTo(sx,sy);c.lineTo(p.x,p.y)}
 if(tool==='rect')c.rect(sx,sy,p.x-sx,p.y-sy);
 if(tool==='ellipse')c.ellipse((sx+p.x)/2,(sy+p.y)/2,Math.abs(p.x-sx)/2,Math.abs(p.y-sy)/2,0,0,Math.PI*2);
 c.stroke();c.restore();
 }
 e.preventDefault();
}
function up(){if(drawing){drawing=false;snapshot()}}
paper.addEventListener('pointerdown',down);
paper.addEventListener('pointermove',move);
window.addEventListener('pointerup',up);
paper.style.touchAction='none';
function fill(x,y){
 let c=current().ctx,img=c.getImageData(0,0,W,H),d=img.data;
 let start=(Math.floor(y)*W+Math.floor(x))*4;
 let old=[d[start],d[start+1],d[start+2],d[start+3]];
 let rgb=[parseInt(ink.slice(1,3),16),parseInt(ink.slice(3,5),16),parseInt(ink.slice(5,7),16)];
 if(old[0]===rgb[0]&&old[1]===rgb[1]&&old[2]===rgb[2])return;
 let stack=[[Math.floor(x),Math.floor(y)]],seen=new Set(),count=0;
 while(stack.length&&count<500000){
 let [a,b]=stack.pop();if(a<0||b<0||a>=W||b>=H)continue;
 let k=b*W+a;if(seen.has(k))continue;seen.add(k);
 let q=k*4;if(d[q]!==old[0]||d[q+1]!==old[1]||d[q+2]!==old[2]||d[q+3]!==old[3])continue;
 d[q]=rgb[0];d[q+1]=rgb[1];d[q+2]=rgb[2];d[q+3]=255;
 stack.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);count++;
 }
 c.putImageData(img,0,0);
}
function newLayer(){layers.push(makeLayer('Слой '+(layers.length+1)));active=layers.length-1;renderLayers();snapshot()}
function deleteLayer(){if(layers.length===1){clearLayer();return}paper.removeChild(current().canvas);layers.splice(active,1);active=Math.max(0,active-1);renderLayers();snapshot()}
function clearLayer(){current().ctx.clearRect(0,0,W,H);snapshot()}
function layerOpacity(v){current().opacity=v/100;current().canvas.style.opacity=v/100}
function moveLayer(dir){let n=active+dir;if(n<0||n>=layers.length)return;[layers[active],layers[n]]=[layers[n],layers[active]];paper.insertBefore(layers[n].canvas,layers[active].canvas);active=n;renderLayers();snapshot()}
function flip(){let c=current(),tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;let x=tmp.getContext('2d');x.translate(W,0);x.scale(-1,1);x.drawImage(c.canvas,0,0);c.ctx.clearRect(0,0,W,H);c.ctx.drawImage(tmp,0,0);snapshot()}
function merged(){let c=document.createElement('canvas');c.width=W;c.height=H;let x=c.getContext('2d');layers.forEach(l=>{if(l.visible){x.globalAlpha=l.opacity;x.drawImage(l.canvas,0,0)}});x.globalAlpha=1;return c}
function savePNG(){let a=document.createElement('a');a.href=merged().toDataURL('image/png');a.download='drawing.png';a.click()}
function saveJPG(){let c=merged(),x=c.getContext('2d');x.globalCompositeOperation='destination-over';x.fillStyle='white';x.fillRect(0,0,W,H);let a=document.createElement('a');a.href=c.toDataURL('image/jpeg');a.download='drawing.jpg';a.click()}
function saveProject(){let d={layers:layers.map(l=>({name:l.name,opacity:l.opacity,visible:l.visible,data:l.canvas.toDataURL()}))};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='project.json';a.click()}
function loadProject(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{restore(JSON.parse(r.result).layers);snapshot()}catch(x){alert('Ошибка проекта')}};r.readAsText(f)}
['#222222','#ffffff','#f44336','#ff9800','#ffeb3b','#4caf50','#00bcd4','#2196f3','#3f51b5','#9c27b0','#e91e63','#795548','#888888'].forEach(v=>{let b=document.createElement('button');b.className='sw';b.style.background=v;b.onclick=()=>{ink=v;document.getElementById('color').value=v};document.getElementById('swatches').appendChild(b)});
layers=[makeLayer('Слой 1')];renderLayers();snapshot();
</script>
</body>
</html>
